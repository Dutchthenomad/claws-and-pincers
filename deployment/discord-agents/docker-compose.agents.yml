# OpenClaw Single Gateway — 5 Discord Agents via Routing Bindings
# Replaced 5-container architecture (OOM crash-looping) with single gateway
# Updated: 2026-02-28
#
# Architecture: One openclaw-gateway container serves all 5 Discord bot accounts.
# Agent routing is handled via bindings[] in openclaw.json, not separate containers.
#
# Volumes:
#   - /opt/openclaw/config → OpenClaw config, agent workspaces, agent state dirs
#   - /opt/openclaw/discord-agents/shared-governance → Governance docs (read-only)
#
# Secrets: /opt/openclaw/config/.env (Discord tokens, OpenRouter key, gateway token)

services:
  openclaw-gateway:
    image: openclaw:local
    container_name: openclaw-gateway
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    env_file:
      - /opt/openclaw/config/.env
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - NODE_OPTIONS=--max-old-space-size=1536
      - TZ=America/New_York
    volumes:
      - /opt/openclaw/config:/home/node/.openclaw
      - /opt/openclaw/discord-agents/shared-governance:/opt/governance:ro
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    networks:
      - n8n_default
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n_default:
    external: true
