services:
  openclaw-gateway:
    image: openclaw:local
    container_name: openclaw-gateway
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
      - "100.113.138.27:18789:18789"  # Tailscale VPN — node pairing from ThinkPad
    env_file:
      - /opt/openclaw/config/.env
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - NODE_OPTIONS=--max-old-space-size=1536
      - TZ=America/New_York
    volumes:
      - /opt/openclaw/config:/home/node/.openclaw
      - /opt/openclaw/discord-agents/shared-governance:/opt/governance:ro
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    networks:
      - n8n_default
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n_default:
    external: true
