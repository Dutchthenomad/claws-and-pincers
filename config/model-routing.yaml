# OpenClaw Model Routing Configuration
# Defines how to route requests to different LLM providers
# Updated: 2026-02-26 — Migrated to OpenRouter-first for Discord agents

routing:
  enabled: true
  default_provider: openrouter
  default_model: moonshotai/kimi-k2.5

# Provider configurations
providers:
  openrouter:
    enabled: true
    env_var: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    primary: true
    models:
      - id: anthropic/claude-opus-4-6
        alias: [opus, claude-opus]
        assigned_to: orchestrator
        use_for: [coordination, governance, complex_reasoning]
        max_tokens: 8192

      - id: minimax/minimax-m2.5
        alias: [minimax, m2.5]
        assigned_to: developer
        use_for: [coding, implementation, debugging, automation]
        max_tokens: 8192

      - id: x-ai/grok-4.1-fast
        alias: [grok, grok-fast]
        assigned_to: researcher
        use_for: [research, analysis, web_search, deep_research]
        max_tokens: 8192

      - id: moonshotai/kimi-k2.5
        alias: [kimi, k2.5]
        assigned_to: sysadmin
        use_for: [infrastructure, reasoning, math, coding, cost_sensitive]
        max_tokens: 8192
        universal_fallback: true

      - id: google/gemini-3-flash-preview
        alias: [gemini, gemini-flash]
        assigned_to: reviewer
        use_for: [review, quality_gates, fast_analysis, multimodal]
        max_tokens: 8192

  # Direct Anthropic (fallback provider)
  anthropic:
    enabled: true
    env_var: ANTHROPIC_API_KEY
    models:
      - id: claude-sonnet-4-5
        alias: [sonnet, claude-sonnet]
        use_for: [general, coding, analysis]
        max_tokens: 8192

  # Groq (fast/free fallback)
  groq:
    enabled: true
    env_var: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    models:
      - id: llama-3.3-70b-versatile
        alias: [llama70b, groq-llama]
        use_for: [general, coding, cost_sensitive]
        max_tokens: 8192
        free_tier: true

      - id: llama-3.1-8b-instant
        alias: [llama8b, groq-fast]
        use_for: [quick_tasks, simple_queries]
        max_tokens: 4096
        free_tier: true

# Agent-to-model mapping (Discord agents via OpenRouter)
agent_models:
  orchestrator:
    primary: openrouter/anthropic/claude-opus-4-6
    fallback: openrouter/moonshotai/kimi-k2.5

  developer:
    primary: openrouter/minimax/minimax-m2.5
    fallback: openrouter/moonshotai/kimi-k2.5

  researcher:
    primary: openrouter/x-ai/grok-4.1-fast
    fallback: openrouter/moonshotai/kimi-k2.5

  sysadmin:
    primary: openrouter/moonshotai/kimi-k2.5
    fallback: openrouter/google/gemini-3-flash-preview

  reviewer:
    primary: openrouter/google/gemini-3-flash-preview
    fallback: openrouter/moonshotai/kimi-k2.5

# Fallback chain if primary provider fails
fallback_chain:
  - openrouter
  - anthropic
  - groq

# Rate limiting (per minute)
rate_limits:
  openrouter: 120
  anthropic: 60
  groq: 30

# Heartbeat model overrides (lightweight, cost-sensitive)
# Uses Groq free tier to minimize cost on frequent periodic calls
heartbeat_overrides:
  sysadmin:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 15
    purpose: infrastructure health check
  researcher:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 30
    purpose: source freshness check
  developer:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 30
    purpose: workspace and build status
  reviewer:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 60
    purpose: pending review queue check

# Cron job model overrides (scheduled tasks, cost-sensitive)
cron_overrides:
  cost_usage_check:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 60
    purpose: Native OpenClaw /usage endpoint polling
  config_drift_check:
    model: groq/llama-3.3-70b-versatile
    interval_minutes: 120
    purpose: Live gateway state vs declared config comparison

# Cost thresholds for alerts (USD)
cost_alerts:
  per_request_warn: 0.50
  daily_warn: 10.00
  daily_hard_limit: 25.00
