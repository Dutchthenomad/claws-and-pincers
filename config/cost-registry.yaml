# OpenClaw Cost Registry
# Updated: 2026-03-01 — Native OpenClaw cost tracking, OpenRouter-first model stack

paid_services:
  llm_apis:
    openrouter:
      type: per-token
      models:
        - anthropic/claude-opus-4-6
        - minimax/minimax-m2.5
        - x-ai/grok-4.1-fast
        - moonshotai/kimi-k2.5
        - google/gemini-3-flash-preview
      billing: monthly
      dashboard: https://openrouter.ai/activity
      budget_alert_usd: 150
      status: active
      notes: Primary provider for all 5 Discord agents

    anthropic:
      type: per-token
      models: [claude-sonnet-4-5]
      billing: monthly
      dashboard: https://console.anthropic.com
      budget_alert_usd: 50
      status: active
      notes: Direct API fallback provider

    groq:
      type: free-tier
      models: [llama-3.3-70b-versatile, llama-3.1-8b-instant]
      billing: free
      dashboard: https://console.groq.com
      budget_alert_usd: 0
      status: active
      notes: Free tier fallback for cost-sensitive tasks

  infrastructure:
    hostinger_vps:
      type: fixed_monthly
      cost_usd: 15
      purpose: OpenClaw host (srv1216617)
      status: active

budget_totals:
  monthly_estimate_usd: 200
  alert_threshold_percent: 80

tracking:
  database: timescaledb
  table: openclaw.cost_events
  retention_days: 90
  method: Native OpenClaw /usage endpoint + cron job
  notes: Cost data polled hourly via Groq llama-3.3-70b-versatile (free tier), stored in TimescaleDB

