# OpenClaw Voice 2FA Configuration
# Created: 2026-02-01

voiceprint:
  enabled: true
  enrollment_status: pending  # Changes to 'enrolled' after setup

  enrollment:
    required_samples: 3
    min_duration_seconds: 2
    max_duration_seconds: 10
    phrases:
      - "authorize this action"
      - "confirm the request"
      - "approve the transaction"

  verification:
    model: "speechbrain/spkrec-ecapa-voxceleb"
    confidence_threshold: 0.85  # 85% match required
    max_attempts: 3
    lockout_minutes: 15  # After max failed attempts
    max_duration_seconds: 10

  anti_spoofing:
    liveness_detection: true
    reject_recordings: true
    require_unique_phrase: false  # Random phrase selection

  fallback:
    pin_enabled: true
    pin_max_attempts: 3
    pin_lockout_minutes: 30

  storage:
    embeddings_path: "/opt/openclaw/data/memory/voiceprint_embeddings.pkl"
    enrollment_samples_path: "/opt/openclaw/data/memory/enrollment_samples/"
